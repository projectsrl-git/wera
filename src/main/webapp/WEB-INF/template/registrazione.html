<!DOCTYPE html>
<html>

<head>

 <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WERA - Registrazione</title>


    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="font-awesome/css/font-awesome.css" rel="stylesheet">

    <link href="css/animate.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    
    <script type="text/javascript">
		$(function(){
			$("#Login").validate({
				submitHandler: function(form) {
					// do other things for a valid form
					form.submit();
				}
			});
		});
    </script> 
    

</head>

<body class="gray-bg">

  <div class="auth-box" style="min-height: 100vh; display: table; width: 100%; background: #f8f9fa;">
 	 <div class="container" style="height:100vh; display: table; width: 100%;">
  		<div class="row" style="display: table-cell; vertical-align: middle;">
  		
  		<div class="text-center" style="margin-bottom: 15px; max-width: 400px; margin-left: auto; margin-right: auto;">
  		<img src="img/wera-login.png" alt="Wera logo" style="max-width: 380px; height: auto;">
  		</div>
  		
    	<div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2" style="max-width: 400px; margin: 0 auto; float: none;">

      
        <!-- Brand / Logo -->
		<div class="text-center" style="margin-bottom: 30px; max-width: 400px; margin-left: auto; margin-right: auto;">
		  
		
		  <h4 style="font-weight: 700; margin-top: 15px;">
		    Registrati su WebCredit WERA
		  </h4>
		
		  <p class="text-muted" style="max-width: 350px; margin: 10px auto 0;">
		    Crea il tuo account.
		  </p>
		</div>


        <!-- Card-like box -->
        <div class="panel panel-default" style="border-radius: 5px; padding: 30px;">
          <form action="astro" method="post" id="Registrazione">
            			<input type="hidden" id="FUNCTIONID" name="FUNCTIONID" value="Registrazione" />

            <div class="form-group">
              <label for="userEmail">Nome <span style="color: #d9534f;">*</span></label>
              	<input type="text" class="form-control" name="NOME" id="NOME" placeholder="Nome" required="">
            </div>

            <div class="form-group">
              <label for="userPassword">Cognome <span style="color: #d9534f;">*</span></label>
              <input type="text" class="form-control" name="COGNOME" id="COGNOME" placeholder="Cognome" required="">
            </div>
            
             <div class="form-group">
              <label for="userPassword">Email <span style="color: #d9534f;">*</span></label>
              <input type="email" class="form-control" name="EMAIL" id="EMAIL" placeholder="Indirizzo mail" required="">
            </div>
            
             <div class="form-group">
              <label for="userPassword">Rilevatore <span style="color: #d9534f;">*</span></label>
              <input type="text" class="form-control" name="RILEVATORE" id="RILEVATORE" placeholder="Rilevatore" required="">
            </div>

           
            <button type="submit" class="btn btn-primary btn-block" style="font-weight: 600; padding: 10px 0;">
              Registrati
            </button>
          </form>

          <p class="text-muted text-center" style="margin-top: 20px; font-size: 14px;">
            Hai già un account? <a href="astro?FUNCTIONID=Login" style="text-decoration: underline; font-weight: 600;">Login</a>
          </p>
        </div>

        <p class="text-center text-muted" style="margin-top: 30px; font-size: 13px;">
          © 2017-<script>document.write(new Date().getFullYear())</script> Webcredit WERA — vers 3.0 <br/> Powered by Project srl
        </p>

      </div>
    </div>
  </div>
</div>



<!-- Mainly scripts -->
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.js"></script>

</body>

</html>
