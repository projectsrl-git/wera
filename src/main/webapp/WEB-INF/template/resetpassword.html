<!DOCTYPE html>
<html>

<head>

 <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WERA - Reset password</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="font-awesome/css/font-awesome.css" rel="stylesheet">
    <link href="css/animate.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <!-- WERA theme 2026: font + design system. DEVE restare ULTIMO tra i CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/wera-theme.css?20260717" rel="stylesheet">

</head>

<body class="gray-bg auth-page">

  <div class="auth-wrap">

    <div class="auth-logo">
      <a href="astro?FUNCTIONID=Login"><img src="img/wera-login.png" alt="Wera logo"></a>
    </div>

    <h1 class="auth-claim">Password dimenticata</h1>
    <p class="auth-sub">Inserisci la tua email: ti invieremo le istruzioni per reimpostarla.</p>

    <div class="auth-card">
      <form action="astro" method="post" id="ResetPassword">
        <input type="hidden" id="FUNCTIONID" name="FUNCTIONID" value="ResetPassword" />

        <div class="form-group">
          <label for="userEmail">Email <span class="req-mark">*</span></label>
          <input type="email" class="form-control" name="EMAIL" id="EMAIL" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Reimposta password
        </button>
      </form>

      <p class="auth-alt">
        Torna al <a href="astro?FUNCTIONID=Login">Login</a>
      </p>
    </div>

    <p class="auth-foot">
      &copy; 2017-<script>document.write(new Date().getFullYear())</script> Webcredit WERA &ndash; vers 3.0 <br/> Powered by Project srl
    </p>

  </div>

<!-- Mainly scripts -->
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.js"></script>

</body>

</html>
