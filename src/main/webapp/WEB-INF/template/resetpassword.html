<!DOCTYPE html>
<html lang="it">

<head>

 <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WERA &middot; Reset password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/wera-landing.css?20261026" rel="stylesheet">

</head>

<body>

<div class="topbar">
  <span class="logoplate"><img src="img/wera-login.png" alt="Webcredit WERA" style="height:34px"></span>
  <a href="astro?FUNCTIONID=Login">&larr; Torna alla home</a>
</div>

<div class="wrap">
  <div class="onecol">

    <div class="head">
      <span class="chip"><span class="dot a"></span> Area riservata</span>
      <h1 style="margin-top:14px;font-size:30px">Password dimenticata</h1>
      <p>Inserisci la tua email: ti invieremo le istruzioni per reimpostarla.</p>
    </div>

    <div class="card formcard">
      <form action="astro" method="post" id="ResetPassword">
        <input type="hidden" id="FUNCTIONID" name="FUNCTIONID" value="ResetPassword" />

        <div class="field"><label for="EMAIL">Email <span class="req">*</span></label>
          <input type="email" name="EMAIL" id="EMAIL" autocomplete="email" placeholder="nome.utente@dominio.it" required></div>

        <button class="btn block" type="submit">Reimposta password</button>
      </form>
      <p class="muted center" style="margin:16px 0 0;font-size:13.5px">Ricordi la password? <a href="astro?FUNCTIONID=Login#login" style="color:var(--accent-ink);font-weight:700;text-decoration:none">Accedi</a></p>
    </div>

    <p class="auth-foot">
      &copy; 2017-<script>document.write(new Date().getFullYear())</script> Webcredit WERA &ndash; vers 3.0 &middot; Powered by Project srl
    </p>

  </div>
</div>

<!-- Mainly scripts -->
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.js"></script>

</body>

</html>
