<!-- Full Calendar -->
<script src="js/plugins/fullcalendar/fullcalendar.min.js?20201116"></script>

<script>






$(document).ready(function() {

        /* initialize the external events
         -----------------------------------------------------------------*/


        $('#external-events div.external-event').each(function() {

            // store data so the calendar knows to render an event upon drop
            $(this).data('event', {
                title: $.trim($(this).text()), // use the element's text as the event title
                stick: true // maintain when user navigates (see docs on the renderEvent method)
            });

            // make the event draggable using jQuery UI
            $(this).draggable({
                zIndex: 1111999,
                revert: true,      // will cause the event to go back to its
                revertDuration: 0  //  original position after the drag
            });

        });
        
        
        
        /* initialize the calendar
        -----------------------------------------------------------------*/
       var date = new Date();
       var d = date.getDate();
       var m = date.getMonth();
       var y = date.getFullYear();

      
    	

        /* initialize the calendar
         -----------------------------------------------------------------*/
       

        $('#calendar').fullCalendar({
            header: {
                left: 'prev,next today',
                center: 'title',
                //right: 'month,agendaWeek,agendaDay'
                right: 'month,basicWeek,basicDay'
            },
            monthNames: ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],
            monthNamesShort: ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'],
            dayNames: ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'],
            dayNamesShort: ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'],
            editable: false,
            droppable: false, // this allows things to be dropped onto the calendar
            drop: function() {
                // is the "remove after drop" checkbox checked?
                if ($('#drop-remove').is(':checked')) {
                    // if so, remove the element from the "Draggable Events" list
                    $(this).remove();
                }
            },
            //"events":[{"id":"9","title":"324TRIESTE (PAVIA) - Catalogo_Caldaie_Power.pdf","start":"2020-01-01","allDay":"true"},{"id":"7","title":"324TRIESTE (PAVIA) - TRIESTE.pdf","start":"2020-01-01","allDay":"true"},{"id":"8","title":"324TRIESTE (PAVIA) - TRIESTE_GOOGLE.PNG","start":"2020-01-01","allDay":"true"},{"id":"6","title":"324URANIA (SAN MARTINO SICCOMARIO) - URANIA montini.pdf","start":"2020-01-01","allDay":"true"},]
            //arrayOfEvents
        });

        
        /* finish initialize the calendar
        -----------------------------------------------------------------*/
				
			
        var events=new Array();
    	var txt="";
    	
    	$.ajax({
    		url: "astro?FUNCTIONID=JSONDataSet&dataset=DSCalendarioFileManager&columns=DATA_SCADENZA_RIPETUTA,DENOMINAZIONE,NOME_FILE,ID_MODULO,LOCALITA,DIFFERENZA_GIORNO",
    		dataType: 'json',
    		type: 'GET',
    		success: function (data) {
    			
    			$.each(data.rows,function(i,data) {
    				var scadenza=eval("data.DATA_SCADENZA_RIPETUTA");
    				var denominazione=eval("data.DENOMINAZIONE");
    				var nomeFile=eval("data.NOME_FILE");
    				var idModulo=eval("data.ID_MODULO");
    				var localita=eval("data.LOCALITA");
    				var diffGiorno=eval("data.DIFFERENZA_GIORNO")+0;
    				diffGiorno=parseInt(diffGiorno);
    				
    				var denFile=denominazione+' ('+localita+')'+' - '+nomeFile;
    				
    				event = new Object();
    				event.title = denFile; // this should be string
    			    event.start = scadenza; // this should be date object
    			    event.color = "orangered";
    			    event.allDay = true;
    			    events.push(event);  

    			});	
    			$('#calendar').fullCalendar('addEventSource',events);
    		}
    	});
    	
    	
    	

    
});

</script>
