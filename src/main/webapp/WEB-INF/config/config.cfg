DS.DataSetConsumiTotaliSingoli.Class=net.project.dataset.DBDataSet
DS.DataSetConsumiTotaliSingoli.Row=net.projectsrl.db.PjDBRow
DS.DataSetConsumiTotaliSingoli.Query=SELECT ID_CONDOMINO,DENOMINAZIONE,coalesce(SUM(CAST(LETTURA AS INT)),0) AS LETTURA_CONDOMINO,Coalesce(SUM(lettura_acs::numeric(10,2)), 0)::numeric(10,2) AS LETTURA_CONDOMINO_ACS,MILLESIMI_CLIMA,MILLESIMI_ACS,MILLESIMI,NUMERO_RIPARTITORI, fattore_energia, \
coalesce(FABBISOGNO_CLIMA,0) as FABBISOGNO_CLIMA,COALESCE(FABBISOGNO_ACS,0) AS FABBISOGNO_ACS,tipo_utenza FROM ( \
SELECT DA.ID_CONDOMINIO,DA.RILEVATORE,LETTURA,LETTURA_ACS,DENOMINAZIONE,UT.ID_MODULO AS ID_CONDOMINO,MILLESIMI_CLIMA,MILLESIMI_ACS,FABBISOGNO_CLIMA,FABBISOGNO_ACS,MILLESIMI, fattore_energia,tipo_utenza, \
(SELECT COUNT(RILEVATORE) FROM UTENZE_DETTAGLIO AS UD WHERE UT.ID_MODULO=UD.ID_MODULO GROUP BY ID_MODULO) AS NUMERO_RIPARTITORI \
FROM DATI_RILEVATORI AS DA \
LEFT OUTER JOIN UTENZE_DETTAGLIO AS UD ON DA.RILEVATORE=UD.RILEVATORE \
LEFT OUTER JOIN UTENZE AS UT ON UT.ID_MODULO=UD.ID_MODULO \
WHERE \
to_date('01/'|| LPAD(DA.MESE::text, 2, '0') || '/' || DA.ANNO ,'DD/MM/YYYY') <= to_date('#DATA_AL#','DD/MM/YYYY') AND to_date('01/' || LPAD(DA.MESE::text, 2, '0') || '/'  || DA.ANNO,'DD/MM/YYYY') >= to_date('#DATA_DAL#','DD/MM/YYYY') \
AND DA.ID_CONDOMINIO=#STABILE#  and UT.ID_MODULO>0 \
) AS TBL \
GROUP BY ID_CONDOMINO,DENOMINAZIONE,MILLESIMI_CLIMA,MILLESIMI_ACS,NUMERO_RIPARTITORI,FABBISOGNO_CLIMA,FABBISOGNO_ACS,MILLESIMI, fattore_energia,tipo_utenza ORDER BY fattore_energia desc,TIPO_UTENZA desc,DENOMINAZIONE asc




DS.DataSetConsumiTotaliSingoliLetture.Class=net.project.dataset.DBDataSet
DS.DataSetConsumiTotaliSingoliLetture.Row=net.projectsrl.db.PjDBRow
DS.DataSetConsumiTotaliSingoliLetture.Query=SELECT ID_CONDOMINO,DENOMINAZIONE,coalesce(SUM(CAST(LETTURA AS INT)),0) AS LETTURA_CONDOMINO,Coalesce(SUM(lettura_acs::numeric(10,2)), 0)::numeric(10,2) AS LETTURA_CONDOMINO_ACS \
,Coalesce(SUM(lettura_afs::numeric(10,2)), 0)::numeric(10,2) AS LETTURA_CONDOMINO_AFS,MILLESIMI_CLIMA,MILLESIMI_ACS,MILLESIMI,NUMERO_RIPARTITORI, \
coalesce(FABBISOGNO_CLIMA,0) as FABBISOGNO_CLIMA,COALESCE(FABBISOGNO_ACS,0) AS FABBISOGNO_ACS,tipo_utenza FROM ( \
SELECT DA.ID_CONDOMINIO,DA.RILEVATORE,LETTURA,LETTURA_ACS,LETTURA_AFS,DENOMINAZIONE,UT.ID_MODULO AS ID_CONDOMINO,MILLESIMI_CLIMA,MILLESIMI_ACS,FABBISOGNO_CLIMA,FABBISOGNO_ACS,MILLESIMI, tipo_utenza, \
(SELECT COUNT(RILEVATORE) FROM UTENZE_DETTAGLIO AS UD WHERE UT.ID_MODULO=UD.ID_MODULO GROUP BY ID_MODULO) AS NUMERO_RIPARTITORI \
FROM DATI_RILEVATORI AS DA \
LEFT OUTER JOIN UTENZE_DETTAGLIO AS UD ON DA.RILEVATORE=UD.RILEVATORE \
LEFT OUTER JOIN UTENZE AS UT ON UT.ID_MODULO=UD.ID_MODULO \
WHERE \
to_date('01/'|| LPAD(DA.MESE::text, 2, '0') || '/' || DA.ANNO ,'DD/MM/YYYY') <= to_date('#DATA_AL#','DD/MM/YYYY') AND to_date('01/' || LPAD(DA.MESE::text, 2, '0') || '/'  || DA.ANNO,'DD/MM/YYYY') >= to_date('#DATA_DAL#','DD/MM/YYYY') \
AND DA.ID_CONDOMINIO=#STABILE#  and UT.ID_MODULO>0 \
) AS TBL \
GROUP BY ID_CONDOMINO,DENOMINAZIONE,MILLESIMI_CLIMA,MILLESIMI_ACS,NUMERO_RIPARTITORI,FABBISOGNO_CLIMA,FABBISOGNO_ACS,MILLESIMI, tipo_utenza ORDER BY TIPO_UTENZA desc,DENOMINAZIONE asc



