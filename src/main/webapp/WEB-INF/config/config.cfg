DS.DSUtenzeDettaglio.Class=net.project.dataset.DBDataSet
DS.DSUtenzeDettaglio.Row=project.db.PjDBRow
DS.DSUtenzeDettaglio.Query=SELECT DISTINCT PA1.DESCRIZIONE AS DESCRIZIONE_TCS, \
PA2.DESCRIZIONE AS DESCRIZIONE_TVA, \
PA3.DESCRIZIONE AS DESCRIZIONE_POS, \
PA4.DESCRIZIONE AS DESCRIZIONE_DTT, \
PA5.DESCRIZIONE AS DESCRIZIONE_MAT, \
PA6.DESCRIZIONE AS DESCRIZIONE_TIPO_RILEVATORE, \
ud.* FROM utenze_dettaglio as ud \
LEFT OUTER JOIN PARAMETRI AS PA1 ON PA1.CODICE = ud.tipo AND PA1.DOMINIO='TCS' \
LEFT OUTER JOIN PARAMETRI AS PA2 ON PA2.CODICE = ud.tipo_valvola AND PA2.DOMINIO='TVA' \
LEFT OUTER JOIN PARAMETRI AS PA3 ON PA3.CODICE = ud.pos AND PA3.DOMINIO='POS' \
LEFT OUTER JOIN PARAMETRI AS PA4 ON PA4.CODICE = ud.diametro AND PA4.DOMINIO='DTT' \
LEFT OUTER JOIN PARAMETRI AS PA5 ON PA5.CODICE = ud.mat_tubo AND PA5.DOMINIO='MAT' \
LEFT OUTER JOIN PARAMETRI AS PA6 ON PA6.CODICE = ud.tipo_rilevatore AND PA6.DOMINIO='DUT' \
#WHERECONDITION# order by stanza

DS.DSUtenzeDettaglioStampaNumeroRighe.Class=net.project.dataset.DBDataSet
DS.DSUtenzeDettaglioStampaNumeroRighe.Row=project.db.PjDBRow
DS.DSUtenzeDettaglioStampaNumeroRighe.Query=select COUNT(*)::int as numero from( SELECT DISTINCT PA1.DESCRIZIONE AS DESCRIZIONE_TCS, \
PA2.DESCRIZIONE AS DESCRIZIONE_TVA, \
PA3.DESCRIZIONE AS DESCRIZIONE_POS, \
PA4.DESCRIZIONE AS DESCRIZIONE_DTT, \
PA5.DESCRIZIONE AS DESCRIZIONE_MAT, \
ud.* FROM utenze_dettaglio as ud \
LEFT OUTER JOIN PARAMETRI AS PA1 ON PA1.CODICE = ud.tipo AND PA1.DOMINIO='TCS' \
LEFT OUTER JOIN PARAMETRI AS PA2 ON PA2.CODICE = ud.tipo_valvola AND PA2.DOMINIO='TVA' \
