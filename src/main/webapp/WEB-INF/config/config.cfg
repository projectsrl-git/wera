DS.DSSegnalazioneRilevatoriErrore.Class=net.project.dataset.DBDataSet
DS.DSSegnalazioneRilevatoriErrore.Row=net.projectsrl.db.PjDBRow
DS.DSSegnalazioneRilevatoriErrore.Query=\
select DISTINCT * FROM V_RILEVATORI_ERRORE AS VRE \
left outer join distribution_list as dl on dl.id_azienda=VRE.id_azienda \
LEFT OUTER JOIN V_DELAY_MAIL_ERRORI AS VDME ON VRE.ID_CONDOMINIO=VDME.ID_MODULO \
WHERE ANOMALIA<>'' AND CONDOMINIO<>'' AND VRE.ID_AZIENDA #WHERECONDITION_AZIENDE# AND DL.MODULO='SEGNALAZIONE_ERRORI' AND DIFFERENZA%DELAY=0 \
order by lista_mail,condominio,denominazione,locatario,n_fabbrica_dispositivo



DS.DSGestioneRilevatoriErroreRiepilogo.Class=net.project.dataset.DBDataSet
DS.DSGestioneRilevatoriErroreRiepilogo.Row=net.projectsrl.db.PjDBRow
DS.DSGestioneRilevatoriErroreRiepilogo.Query=\
select distinct count(vusdsr.n_fabbrica_dispositivo) as totale_anomalie,anomalia,vusdsr.id_condominio \
,co.denominazione as condominio,co.indirizzo,co.localita,co.provincia,co.sim \
,pa.descrizione as descri_anomalia,pa3.descrizione as colore_html ,lista_mail \
from V_ULTIMO_SCARICO_DATI_NEW as vusdsr \
left outer join condomini as co on vusdsr.id_condominio=co.id_modulo \
left outer join utenze_dettaglio as ud on vusdsr.n_fabbrica_dispositivo=ud.rilevatore \
left outer join utenze as ut on ud.id_modulo=ut.id_modulo \
left outer join network as nw on vusdsr.n_fabbrica_dispositivo=nw.antenna \
left outer join parametri as pa on pa.codice=anomalia and pa.dominio='ERR' \
left outer join configurazione_errori as ce on ce.id_errore=pa.id_parametro \
left outer join parametri as pa2 on pa2.codice=ce.COLORE and pa2.dominio='COL' \
left outer join parametri as pa3 on pa3.codice=pa2.codice and pa3.dominio='CCO' \
left outer join distribution_list as dl on dl.id_azienda=vusdsr.id_azienda \
WHERE anomalia<>'' AND DL.MODULO='SEGNALAZIONE_ERRORI' and vusdsr.id_azienda #WHERECONDITION_AZIENDE# \
group by vusdsr.id_condominio,anomalia,co.denominazione,co.indirizzo,co.localita,co.provincia,co.sim,pa.descrizione,pa3.descrizione ,lista_mail \
order by co.denominazione,lista_mail
;





