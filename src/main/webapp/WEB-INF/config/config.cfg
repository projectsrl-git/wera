DS.DataSetContatoriRipartitori.Class=net.project.dataset.DBDataSet
DS.DataSetContatoriRipartitori.Row=net.projectsrl.db.PjDBRow
DS.DataSetContatoriRipartitori.Query=SELECT \
COUNT(distinct rilevatore) FILTER (WHERE FATTORE_ENERGIA='8' and  rilevatore in (select rilevatore from utenze))::int AS RIPARTITORE_HCA, \
COUNT(distinct rilevatore) FILTER (WHERE FATTORE_ENERGIA='6' and  rilevatore in (select rilevatore from utenze))::int AS CONTATORE_ACS, \
COUNT(distinct rilevatore) FILTER (WHERE FATTORE_ENERGIA='13' and  rilevatore in (select rilevatore from utenze))::int AS CONTATORE_HCA, \
COUNT(distinct rilevatore) FILTER (WHERE rilevatore in (select contatore from contatori where id_tipologia='A'))::int AS CONTATORE_ACS_EDIFICIO, \
COUNT(distinct rilevatore) FILTER (WHERE rilevatore in (select contatore from contatori where id_tipologia='R'))::int AS CONTATORE_HCA_EDIFICIO \
FROM DATI_RILEVATORI where id_condominio=#STABILE# and  rilevatore in (select rilevatore from utenze) 


