sum(CONSUMI_ENERGIA_TERMICA_ACS) as CONSUMI_ENERGIA_TERMICA_ACS, \
sum(CONSUMO_TOTALE_EDIFICIO_ENERGIA_TERMICA_RISCALDAMENTO) as CONSUMO_TOTALE_EDIFICIO_ENERGIA_TERMICA_RISCALDAMENTO, \
sum(CONSUMO_TOTALE_EDIFICIO_ENERGIA_TERMICA_ACS) as CONSUMO_TOTALE_EDIFICIO_ENERGIA_TERMICA_ACS, \
sum(CONSUMO_INVOLONTARIO_ENERGIA_TERMICA_ACS) as CONSUMO_INVOLONTARIO_ENERGIA_TERMICA_ACS, \
sum(SPESA_TOTALE_EDIFICIO_ENERGIA_TERMICA_RISCALDAMENTO) as SPESA_TOTALE_EDIFICIO_ENERGIA_TERMICA_RISCALDAMENTO, \
sum(SPESA_TOTALE_EDIFICIO_ENERGIA_TERMICA_ACS) as SPESA_TOTALE_EDIFICIO_ENERGIA_TERMICA_ACS, \
sum(SPESA_TOTALE_EDIFICIO_POTENZA_TERMICA_RISCALDAMENTO) as SPESA_TOTALE_EDIFICIO_POTENZA_TERMICA_RISCALDAMENTO, \
sum(SPESA_TOTALE_EDIFICIO_POTENZA_TERMICA_ACS) as SPESA_TOTALE_EDIFICIO_POTENZA_TERMICA_ACS, \
sum(SPESA_ENERGIA_TERMICA_RISCALDAMENTO) as SPESA_ENERGIA_TERMICA_RISCALDAMENTO, \
sum(SPESA_ENERGIA_TERMICA_ACS) as SPESA_ENERGIA_TERMICA_ACS, \
sum(SPESA_POTENZA_TERMICA_RISCALDAMENTO) as SPESA_POTENZA_TERMICA_RISCALDAMENTO, \
sum(SPESA_POTENZA_TERMICA_ACS) as SPESA_POTENZA_TERMICA_ACS, \
sum(SPESA_TOTALE_RISCALDAMENTO) as SPESA_TOTALE_RISCALDAMENTO, \
sum(SPESA_TOTALE_ACS) as SPESA_TOTALE_ACS, \
sum(SPESA_TOTALE_APPARTAMENTO) as SPESA_TOTALE_APPARTAMENTO, \
SUM(NUMERO_RIPARTITORI)::int AS                                      NUMERO_RIPARTITORI \
from w



DS.DSDatiRipartizioniUNISingolo.Class=net.project.dataset.DBDataSet
DS.DSDatiRipartizioniUNISingolo.Row=net.projectsrl.db.PjDBRow
DS.DSDatiRipartizioniUNISingolo.Query=\
select distinct \
ut.id_modulo as id_condomino, ut.denominazione,ut.locatario,ut.millesimi as millesimi_condomino,stanza,ud.rilevatore \
,coalesce(sum(dr.lettura)::int,0) as lettura_condomino \
,coalesce(sum(dr.volume_attuale)::int,0) as lettura_acs_condomino \
, count(distinct ud.rilevatore)::int as rilevatori_condomino \
from ripartizioni_uni as ri \
left outer join utenze as ut on ri.id_condominio=ut.id_condominio \
left outer join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join dati_rilevatori as dr on ud.rilevatore=dr.rilevatore \
where dr.id_condominio=#ID_CONDOMINIO# and ut.id_modulo=#ID_CONDOMINO# and  to_date('01/'|| LPAD(DR.MESE::text, 2, '0') || '/' || DR.ANNO ,'DD/MM/YYYY') \
<= to_date('#DATA_AL#','DD/MM/YYYY') AND to_date('01/' || LPAD(dr.MESE::text, 2, '0') || '/'  || dr.ANNO,'DD/MM/YYYY') \
>= to_date('#DATA_DAL#','DD/MM/YYYY') \
group by ut.id_modulo,ud.stanza,ud.rilevatore \
order by denominazione,locatario


