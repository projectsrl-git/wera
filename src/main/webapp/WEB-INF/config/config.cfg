DS.DSUtenzeDettaglioCondomini.Class=net.project.dataset.DBDataSet
DS.DSUtenzeDettaglioCondomini.Row=project.db.PjDBRow
DS.DSUtenzeDettaglioCondomini.Query=SELECT DISTINCT \
co.id_modulo as id_condominio, \
co.denominazione as condominio, \
ut.denominazione,ut.locatario,ut.n_telefono,ut.scala,ut.piano,ut.interno, \
ut.millesimi,ut.millesimi_acs,ut.millesimi_clima, \
PA1.DESCRIZIONE AS DESCRIZIONE_TCS, \
PA2.DESCRIZIONE AS DESCRIZIONE_TVA, \
PA3.DESCRIZIONE AS DESCRIZIONE_POS, \
PA4.DESCRIZIONE AS DESCRIZIONE_DTT, \
PA5.DESCRIZIONE AS DESCRIZIONE_MAT, \
PA6.DESCRIZIONE AS DESCRIZIONE_TIPO_RILEVATORE, \
(select sum(coalesce(potenza,0))::numeric(10) as potenza_condomino from utenze_dettaglio as udt where udt.id_modulo=ud.id_modulo) as parziale_potenza,esp as esp_1, \
ud.* FROM utenze_dettaglio as ud \
LEFT OUTER JOIN PARAMETRI AS PA1 ON PA1.CODICE = ud.tipo AND PA1.DOMINIO='TCS' \
LEFT OUTER JOIN PARAMETRI AS PA2 ON PA2.CODICE = ud.tipo_valvola AND PA2.DOMINIO='TVA' \
LEFT OUTER JOIN PARAMETRI AS PA3 ON PA3.CODICE = ud.pos AND PA3.DOMINIO='POS' \
LEFT OUTER JOIN PARAMETRI AS PA4 ON PA4.CODICE = ud.diametro AND PA4.DOMINIO='DTT' \
LEFT OUTER JOIN PARAMETRI AS PA5 ON PA5.CODICE = ud.mat_tubo AND PA5.DOMINIO='MAT' \
LEFT OUTER JOIN PARAMETRI AS PA6 ON PA6.CODICE = ud.tipo_rilevatore AND PA6.DOMINIO='DUT' \
left outer join utenze as ut on ud.id_modulo=ut.id_modulo \
left outer join condomini as co on ut.id_condominio=co.id_modulo \
#WHERECONDITION_CONDOMINIO# \
order by ut.denominazione,ut.locatario,stanza


DS.DSCalendarioFileManager.Class=net.project.dataset.DBDataSet
DS.DSCalendarioFileManager.Row=project.db.PjDBRow
DS.DSCalendarioFileManager.Query=\
select *, \
DATE_PART('day',  now() - data_scadenza_ripetuta)::int as differenza_giorno \
from \
(SELECT DISTINCT \
generate_series(to_date(efifm.data_prima_segnalazione,'YYYY/MM/DD')::timestamp without time zone, timestamp without time zone '2060-12-31', (efifm.gg_segnalazione::char(3)||' day')::interval)::date as data_scadenza_ripetuta, \
INDIRIZZO, LOCALITA,PROVINCIA, \
DENOMINAZIONE,PA.DESCRIZIONE AS DESCR_CATEGORIA, efifm.id_modulo,efifm.id_azienda,efifm.id_condominio,efifm.id_categoria,efifm.nome_file, efifm.data_prima_segnalazione,efifm.gg_segnalazione \
FROM ELENCO_FILE_IMPORTATI_FILE_MANAGER as efifm \
LEFT OUTER JOIN CONDOMINI ON CONDOMINI.ID_MODULO=efifm.ID_CONDOMINIO \
LEFT OUTER JOIN PARAMETRI AS PA ON PA.CODICE = EFIFM.ID_CATEGORIA AND PA.DOMINIO='DOC' \
LEFT OUTER JOIN V_DELAY_MAIL_CENTRALI_TERMICHE AS VDME ON efifm.ID_CONDOMINIO=VDME.ID_MODULO \
AND DIFFERENZA%DELAY=0 \
WHERE EFIFM.ID_AZIENDA \
#WHERECONDITION_AZIENDE# and efifm.gg_segnalazione>0 \
) as t1 \
order by data_scadenza_ripetuta,denominazione,provincia,nome_File



