DS.DSDominiParametriAzienda.Class=net.project.dataset.DBDataSet
DS.DSDominiParametriAzienda.Row=project.db.PjDBRow
DS.DSDominiParametriAzienda.Query=\
SELECT DISTINCT PAR.ID_PARAMETRO,PAR.CODICE,PAR.DESCRIZIONE \
FROM PARAMETRI AS PAR \
LEFT OUTER JOIN PARAMETRI_AZIENDA AS PAZ \
ON PAR.ID_PARAMETRO = PAZ.ID_PARAMETRO \
WHERE DOMINIO='DOM' AND (PAZ.ID_AZIENDA IS NULL OR PAZ.ID_AZIENDA IN (#LISTA_AZIENDE_UTENTE#)) \
ORDER BY DESCRIZIONE

