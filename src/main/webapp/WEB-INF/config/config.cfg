#WHERECONDITION# AND CO.ID_AZIENDA #WHERECONDITION_AZIENDE# AND CO.ID_MODULO #WHERECONDITION_PROFILI# AND nome_file=(SELECT DISTINCT nome_file FROM vista_scarico_data_massima as scarico #WHERECONDITION# AND data_di_lettura= \
(SELECT max(data_di_lettura) FROM vista_scarico_data_massima as scarico #WHERECONDITION# ) limit 1) ) AS tab \
