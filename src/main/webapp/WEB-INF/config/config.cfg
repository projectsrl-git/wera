DS.DataSetConsumoGeneratore.Class=net.project.dataset.DBDataSet
DS.DataSetConsumoGeneratore.Row=net.projectsrl.db.PjDBRow
DS.DataSetConsumoGeneratore.Query=SELECT LETTURA,lettura_ACS,RENDIMENTO_CALDAIA,FABBISOGNO_ANNUO_CLIMA,FABBISOGNO_ANNUO_ACS,PERDITE_IMPIANTO, \
FABBISOGNO_ANNUO_CLIMA/CASE ( fabbisogno_annuo_clima + fabbisogno_annuo_acs ) when 0 then 1 else ( fabbisogno_annuo_clima + fabbisogno_annuo_acs ) end AS FH ,\
FABBISOGNO_ANNUO_ACS/CASE ( fabbisogno_annuo_clima + fabbisogno_annuo_acs ) when 0 then 1 else ( fabbisogno_annuo_clima + fabbisogno_annuo_acs ) end   AS FW  \
FROM( \
SELECT COALESCE(SUM(LETTURA),'0.00') as lettura,COALESCE(SUM(LETTURA_ACS),'0.00') as lettura_ACS, COALESCE(max(RENDIMENTO_CALDAIA),'0.00') AS RENDIMENTO_CALDAIA, \
COALESCE(MAX(FABBISOGNO_ANNUO_CLIMA),0) AS FABBISOGNO_ANNUO_CLIMA,COALESCE(MAX(FABBISOGNO_ANNUO_ACS),0) AS FABBISOGNO_ANNUO_ACS,COALESCE(MAX(PERDITE_IMPIANTO),0) AS PERDITE_IMPIANTO FROM v_DATI_RILEVATORI AS VDR \
left outer join CONDOMINI on CONDOMINI.ID_MODULO=VDR.id_condominio #WHERECONDITION# ) AS TAB 



DS.DataSetConsumiTotaliCondominio.Class=net.project.dataset.DBDataSet
DS.DataSetConsumiTotaliCondominio.Row=net.projectsrl.db.PjDBRow
DS.DataSetConsumiTotaliCondominio.Query=\
SELECT DA.ID_CONDOMINIO,SUM(CAST(LETTURA AS INT)) AS LETTURA_CONDOMINIO, DA.ID_CONDOMINIO,Coalesce(SUM(lettura_acs::numeric(10,2)), 0)::numeric(10,2) AS LETTURA_ACS_CONDOMINIO \
,Coalesce(SUM(lettura_afs::numeric(10,2)), 0)::numeric(10,2) AS LETTURA_AFS_CONDOMINIO FROM DATI_RILEVATORI AS DA \
LEFT OUTER JOIN UTENZE_DETTAGLIO AS UD ON DA.RILEVATORE=UD.RILEVATORE \
LEFT OUTER JOIN UTENZE AS UT ON UT.ID_MODULO=UD.ID_MODULO \
WHERE \
to_date('01/'|| LPAD(DA.MESE::text, 2, '0') || '/' || DA.ANNO ,'DD/MM/YYYY') <= to_date('#DATA_AL#','DD/MM/YYYY') AND to_date('01/' || LPAD(DA.MESE::text, 2, '0') || '/'  || DA.ANNO,'DD/MM/YYYY') >= to_date('#DATA_DAL#','DD/MM/YYYY') \
AND DA.ID_CONDOMINIO = #STABILE# GROUP BY DA.ID_CONDOMINIO



