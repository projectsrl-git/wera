DS.DSAmministratore.Query=\
SELECT UTENTI.ID_UTENTE AS ID_AMMINISTRATORE,NOME||' '||COGNOME AS AMMINISTRATORE FROM UTENTI \
LEFT OUTER JOIN UTENTI_PROFILI ON UTENTI_PROFILI.ID_UTENTE=UTENTI.ID_UTENTE \
LEFT OUTER JOIN PROFILI ON PROFILI.ID_PROFILO=UTENTI_PROFILI.ID_PROFILO \
LEFT OUTER JOIN UTENTI_AZIENDE ON UTENTI_AZIENDE.ID_UTENTE=UTENTI.ID_UTENTE \
where ID_AZIENDA #WHERECONDITION_AZIENDE# #WHERECONDITION# AND PROFILI.CODICE='AMM' ORDER BY NOME,COGNOME


