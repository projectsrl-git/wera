DS.DSUltimiTreAnni.Class=net.project.dataset.DBDataSet
DS.DSUltimiTreAnni.Row=net.projectsrl.db.PjDBRow
DS.DSUltimiTreAnni.Query=\
select * from ( \
SELECT date_part('year', CURRENT_DATE) as codice, date_part('year', CURRENT_DATE) as descri \
union \
SELECT date_part('year', CURRENT_DATE- INTERVAL '1 years') as codice,date_part('year', CURRENT_DATE- INTERVAL '1 years') as descri \
union \
SELECT date_part('year', CURRENT_DATE- INTERVAL '2 years') as codice, date_part('year', CURRENT_DATE- INTERVAL '2 years') as descri \
) as anno \
order by anno desc





