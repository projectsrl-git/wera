DS.DSLettureConsumiCondominiDettaglioStampa.Class=net.project.dataset.DBDataSet
DS.DSLettureConsumiCondominiDettaglioStampa.Row=net.projectsrl.db.PjDBRow
DS.DSLettureConsumiCondominiDettaglioStampa.Query=\
select alias_azienda, * from (\
with w as (\
select distinct id_condominio,id_rilevatore,indirizzo||' - '||cap||' '||localita||' ('||provincia||')' as luogo, denominazione,indirizzo,localita,provincia,id_condomino,condomino,locatario,data_di_lettura,cast(sum(num_rilevatori) as integer) as num_rilevatori,cast(sum(num_contatori) as integer) as num_contatori,tipologia,sum(lettura_attuale::numeric(10,2)) as lettura_attuale,\
Sum(lettura_attuale_acs::numeric(10,2)) AS lettura_attuale_acs, \
Sum(lettura_attuale_afs::numeric(10,2)) AS lettura_attuale_afs, \
sum(volume_attuale::numeric(10,2)) as volume_attuale,sum(lettura_contatore_attuale) as lettura_contatore_attuale,unita_di_misura \
from( \
select distinct id_condominio,id_rilevatore,denominazione,indirizzo,cap,localita,provincia,id_contatore,id_condomino,condomino,locatario,data_di_lettura,count(rilevatore) FILTER (WHERE rilevatore in (select rilevatore from utenze_dettaglio)) as num_rilevatori,count(rilevatore) FILTER (WHERE rilevatore in (select contatore from contatori)) as num_contatori, \
tipologia, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select rilevatore from utenze dettaglio)) as lettura_attuale, \
case when tipologia='Contatore ACS' then Sum(volume_attuale::float) end AS lettura_attuale_acs, \
case when tipologia='Contatore AFS' then Sum(volume_attuale::float) end AS lettura_attuale_afs, \
sum(volume_attuale::float) as volume_attuale, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select contatore from contatori)) as lettura_contatore_attuale, \
unita_di_misura \
from ( \
select co.id_modulo as id_condominio, ut.id_modulo as id_rilevatore,co.denominazione,co.indirizzo,co.cap,co.localita,co.provincia,0 as id_contatore,ut.id_modulo as id_condomino,ut.denominazione as condomino,ut.locatario,\
case when fattore_energia like '08%' then 'Ripartitore HCA' \
when fattore_energia like '07%' then 'Contatore AFS' \
when fattore_energia like '06%' then 'Contatore ACS' \
else 'Ripartitore HCA' end as tipologia, data_di_lettura,rilevatore,lettura_attuale,volume_attuale,\
case when fattore_energia like '08%' then 'HCA' \
when fattore_energia like '07%' then 'M3' \
when fattore_energia like '06%' then 'M3' \
else 'HCA' end as unita_di_misura \
from condomini as co \
inner join utenze as ut on co.id_modulo=ut.id_condominio \
inner join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join vista_scarico_data_massima as scarico on ud.rilevatore=n_fabbrica_dispositivo \
#WHERECONDITION# \
and ut.id_modulo #WHERECONDITION_PROFILI_LETTURE# \
and nome_file=(select distinct nome_file from vista_scarico_data_massima as scarico #WHERECONDITION# and DATA_DI_LETTURA=(select max(data_di_lettura) from vista_scarico_data_massima as scarico #WHERECONDITION#) limit 1) \
union \
select co.id_modulo as id_condominio, ct.id_modulo as id_rilevatore,co.denominazione,co.indirizzo,co.cap,co.localita,co.provincia,ct.id_modulo as id_contatore, 0 as id_condomino, '' as condomino,'' as locatario,'Contatore '||descrizione as tipologia,data_di_lettura,contatore as rilevatore,\
lettura_attuale,volume_attuale,unita_di_misura from condomini as co \
inner join contatori as ct on ct.id_condominio=co.id_modulo \
inner join vista_scarico_data_massima as scarico on ct.contatore=n_fabbrica_dispositivo \
left outer join parametri as pa on id_tipologia=pa.codice and dominio='TCO' \
#WHERECONDITION# \
and co.id_modulo #WHERECONDITION_PROFILI_LETTURE# \
and nome_file=(select distinct nome_file from vista_scarico_data_massima as scarico #WHERECONDITION# and DATA_DI_LETTURA=(select max(data_di_lettura) from vista_scarico_data_massima as scarico #WHERECONDITION#) limit 1) \
) as tab \
group by id_condominio,id_rilevatore,denominazione,indirizzo,cap,localita,provincia,condomino,locatario,data_di_lettura,unita_di_misura,tipologia,id_contatore,id_condomino \
)as tab2 \
group by id_condominio,id_rilevatore,denominazione,indirizzo,cap,localita,provincia,condomino,locatario,unita_di_misura,tipologia,tipologia,unita_di_misura,id_contatore,id_condomino,DATA_DI_LETTURA \
order by tipologia desc,condomino,locatario \
) select * from w union all \
select \
0 as id_condominio, \
0 as id_rilevatore, \
'TOTALE' AS DENOMINAZIONE, \
'' AS indirizzo, \
'' AS cap, \
'' AS localita, \
'' AS provincia, \
0 as id_condomino, \
'TOTALE' AS condomino, \
'TOTALE' as locatario, \
'' as data_di_lettura, \
cast(SUM (num_rilevatori) as integer) AS num_rilevatori, \
cast(SUM (num_contatori) as integer) AS num_contatori, \
'' AS tipologia, \
SUM (lettura_attuale::numeric(10,2)) AS lettura_attuale, \
sum (lettura_attuale_acs::numeric(10,2)) AS lettura_attuale_acs, \
sum (lettura_attuale_afs::numeric(10,2)) AS lettura_attuale_afs, \
SUM (volume_attuale) AS volume_attuale, \
SUM (lettura_contatore_attuale) AS lettura_contatore_attuale, \
max (unita_di_misura) AS unita_di_misura \
from w \
) as t1 left outer join condomini as con on id_condominio=con.id_modulo left outer join aziende as az on az.id_azienda=con.id_azienda order by tipologia desc,condomino,locatario 





