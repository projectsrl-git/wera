DS.DSRipartizioniHome.Class=net.project.dataset.DBDataSet
DS.DSRipartizioniHome.Row=net.projectsrl.db.PjDBRow
DS.DSRipartizioniHome.Query=\
select 'InserimentoRipartizioni' as pagina,to_char(DATE (ru.ts_ins::timestamp::date), 'DD/MM/YYYY') as data_inserimento,to_char(ru.ts_ins, 'HH24:MM') as ora_inserimento, pa.descrizione as descr_stato,coalesce(denominazione,'condominio non censito') as denominazione,co.indirizzo,co.localita,co.provincia,tipo, \
CASE WHEN TIPO = 'L' THEN 'SOLA LETTURA' ELSE 'COMPLETA' END AS TIPO_RIPARTIZIONE, \
'' as DESCR_TIPO_CONTABILIZZAZIONE, \
'Ripartizione' as RIPARTIZIONE, \
substring(data_dal,9,2)||'/'||substring(data_dal,6,2)||'/'||substring(data_dal,1,4) ||' - '||substring(data_al,9,2)||'/'||substring(data_al,6,2)||'/'||substring(data_al,1,4) as periodo \
, ru.id_modulo,ru.id_azienda,ru.nr_modulo,ru.dt_modulo,ru.stato,ru.id_condominio,ru.data_dal,ru.data_al,ru.tipo_ripartizione,ru.id_utente_ins, \
ut.nome ||' '||ut.cognome as nominativo \
from ripartizioni as ru left outer join condomini as co on ru.id_condominio=co.id_modulo left outer join parametri as pa on ru.stato=pa.codice and pa.dominio='STA' \
left outer join utenti as ut on ut.id_utente=ru.id_utente_ins \
where ru.stato <> 'APP' AND RU.ID_AZIENDA #WHERECONDITION_AZIENDE# AND RU.ID_CONDOMINIO #WHERECONDITION_PROFILI# \
union \
select 'InserimentoRipartizioniUNI' as pagina,to_char(DATE (ru.ts_ins::timestamp::date), 'DD/MM/YYYY') as data_inserimento,to_char(ru.ts_ins, 'HH24:MM') as ora_inserimento, pa.descrizione as descr_stato,coalesce(denominazione,'condominio non censito') as denominazione,co.indirizzo,co.localita,co.provincia,tipo, \
CASE WHEN TIPO = 'L' THEN 'SOLA LETTURA' ELSE 'COMPLETA' END AS TIPO_RIPARTIZIONE, \
CASE WHEN ru.TIPO_CONTABILIZZAZIONE = '1' THEN 'Contatori di calore/Contatori volumetrici' WHEN ru.TIPO_CONTABILIZZAZIONE = '2' THEN 'Ripartitori/Contatori volumetrici' END AS DESCR_TIPO_CONTABILIZZAZIONE, \
'Ripartizione UNI' as RIPARTIZIONE, \
substring(data_dal,9,2)||'/'||substring(data_dal,6,2)||'/'||substring(data_dal,1,4) ||' - '||substring(data_al,9,2)||'/'||substring(data_al,6,2)||'/'||substring(data_al,1,4) as periodo \
, ru.id_modulo,ru.id_azienda,ru.nr_modulo,ru.dt_modulo,ru.stato,ru.id_condominio,ru.data_dal,ru.data_al,ru.tipo_ripartizione,ru.id_utente_ins, \
ut.nome ||' '||ut.cognome as nominativo \
from ripartizioni_uni as ru left outer join condomini as co on ru.id_condominio=co.id_modulo left outer join parametri as pa on ru.stato=pa.codice and pa.dominio='STA' \
left outer join utenti as ut on ut.id_utente=ru.id_utente_ins \
where ru.stato <> 'APP' AND RU.ID_AZIENDA #WHERECONDITION_AZIENDE# AND RU.ID_CONDOMINIO #WHERECONDITION_PROFILI# \
union \
select 'InserimentoRipartizioniUNI2018' as pagina,to_char(DATE (ru.ts_ins::timestamp::date), 'DD/MM/YYYY') as data_inserimento,to_char(ru.ts_ins, 'HH24:MM') as ora_inserimento, pa.descrizione as descr_stato,coalesce(denominazione,'condominio non censito') as denominazione,co.indirizzo,co.localita,co.provincia,tipo, \
CASE WHEN TIPO = 'L' THEN 'SOLA LETTURA' ELSE 'COMPLETA' END AS TIPO_RIPARTIZIONE, \
CASE WHEN ru.TIPO_CONTABILIZZAZIONE = '1' THEN 'Contatori di calore/Contatori volumetrici' WHEN ru.TIPO_CONTABILIZZAZIONE = '2' THEN 'Ripartitori/Contatori volumetrici' END AS DESCR_TIPO_CONTABILIZZAZIONE, \
'Ripartizione UNI' as RIPARTIZIONE, \
substring(data_dal,9,2)||'/'||substring(data_dal,6,2)||'/'||substring(data_dal,1,4) ||' - '||substring(data_al,9,2)||'/'||substring(data_al,6,2)||'/'||substring(data_al,1,4) as periodo \
, ru.id_modulo,ru.id_azienda,ru.nr_modulo,ru.dt_modulo,ru.stato,ru.id_condominio,ru.data_dal,ru.data_al,ru.tipo_ripartizione,ru.id_utente_ins, \
ut.nome ||' '||ut.cognome as nominativo \
from ripartizioni_uni_2018 as ru left outer join condomini as co on ru.id_condominio=co.id_modulo left outer join parametri as pa on ru.stato=pa.codice and pa.dominio='STA' \
left outer join utenti as ut on ut.id_utente=ru.id_utente_ins \
where ru.stato <> 'APP' AND RU.ID_AZIENDA #WHERECONDITION_AZIENDE# AND RU.ID_CONDOMINIO #WHERECONDITION_PROFILI# \
union \
select 'InserimentoRipartizioniLetture' as pagina,to_char(DATE (ru.ts_ins::timestamp::date), 'DD/MM/YYYY') as data_inserimento,to_char(ru.ts_ins, 'HH24:MM') as ora_inserimento, pa.descrizione as descr_stato,coalesce(denominazione,'condominio non censito') as denominazione,co.indirizzo,co.localita,co.provincia,tipo, \
'SOLA LETTURA' AS TIPO_RIPARTIZIONE, \
'' AS DESCR_TIPO_CONTABILIZZAZIONE, \
'Ripartizione sola lettura' as RIPARTIZIONE, \
substring(data_dal,9,2)||'/'||substring(data_dal,6,2)||'/'||substring(data_dal,1,4) ||' - '||substring(data_al,9,2)||'/'||substring(data_al,6,2)||'/'||substring(data_al,1,4) as periodo \
, ru.id_modulo,ru.id_azienda,ru.nr_modulo,ru.dt_modulo,ru.stato,ru.id_condominio,ru.data_dal,ru.data_al,ru.tipo_ripartizione,ru.id_utente_ins, \
ut.nome ||' '||ut.cognome as nominativo \
from ripartizioni_letture as ru left outer join condomini as co on ru.id_condominio=co.id_modulo left outer join parametri as pa on ru.stato=pa.codice and pa.dominio='STA' \
left outer join utenti as ut on ut.id_utente=ru.id_utente_ins \
where ru.stato <> 'APP' AND RU.ID_AZIENDA #WHERECONDITION_AZIENDE# AND RU.ID_CONDOMINIO #WHERECONDITION_PROFILI#



