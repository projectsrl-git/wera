DS.DSLettureConsumiStampaNumeroRighe.Row=net.projectsrl.db.PjDBRow
DS.DSLettureConsumiStampaNumeroRighe.Query=\
select count(*)::int+1 as numero from( \
select distinct id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,id_condomino,condomino,locatario,data_di_lettura,sum(num_rilevatori) as num_rilevatori,sum(num_contatori) as num_contatori,tipologia,sum(lettura_attuale) as lettura_attuale,sum(volume_attuale) as volume_attuale,sum(lettura_contatore_attuale) as lettura_contatore_attuale,unita_di_misura \
from( \
select distinct id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,id_contatore,id_condomino,condomino,locatario,data_di_lettura,count(rilevatore) FILTER (WHERE rilevatore in (select rilevatore from utenze_dettaglio)) as num_rilevatori,count(rilevatore) FILTER (WHERE rilevatore in (select contatore from contatori)) as num_contatori, tipologia, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select rilevatore from utenze dettaglio)) as lettura_attuale, \
sum(volume_attuale::float) as volume_attuale, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select contatore from contatori)) as lettura_contatore_attuale, \
unita_di_misura \
from ( \
select co.id_modulo as id_condominio, ut.id_modulo as id_rilevatore,co.denominazione,co.indirizzo,co.localita,co.provincia,0 as id_contatore,ut.id_modulo as id_condomino,ut.denominazione as condomino,ut.locatario,'Ripartitore HCA' as tipologia,data_di_lettura,rilevatore,\
lettura_attuale,volume_attuale,unita_di_misura from condomini as co \
inner join utenze as ut on co.id_modulo=ut.id_condominio \
inner join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join vista_scarico_data_massima as scarico on ud.rilevatore=n_fabbrica_dispositivo \
#WHERECONDITION# \
and ut.id_modulo #WHERECONDITION_PROFILI_LETTURE# \
and nome_file=(select distinct nome_file from vista_scarico_data_massima as scarico #WHERECONDITION# and data_di_lettura=(select max(data_di_lettura) from vista_scarico_data_massima as scarico #WHERECONDITION# ) limit 1) \
union \
select co.id_modulo as id_condominio, ct.id_modulo as id_rilevatore,co.denominazione,co.indirizzo,co.localita,co.provincia,ct.id_modulo as id_contatore, 0 as id_condomino, '' as condomino,'' as locatario,'Contatore '||descrizione as tipologia, \
data_di_lettura,contatore as rilevatore,lettura_attuale,volume_attuale,unita_di_misura from condomini as co \
inner join contatori as ct on ct.id_condominio=co.id_modulo \
inner join vista_scarico_data_massima as scarico on ct.contatore=n_fabbrica_dispositivo \
left outer join parametri as pa on id_tipologia=pa.codice and dominio='TCO' \
#WHERECONDITION# \
and co.id_modulo #WHERECONDITION_PROFILI_LETTURE# \
and nome_file=(select distinct nome_file from vista_scarico_data_massima as scarico #WHERECONDITION# and data_di_lettura=(select max(data_di_lettura) from vista_scarico_data_massima as scarico #WHERECONDITION# ) limit 1) \
) as tab \
group by id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,condomino,locatario,data_di_lettura,unita_di_misura,tipologia,id_contatore,id_condomino \
)as tab2 \
group by id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,condomino,locatario,unita_di_misura,tipologia,tipologia,unita_di_misura,id_contatore,id_condomino,data_di_lettura \
order by tipologia desc,condomino,locatario ) as tab



