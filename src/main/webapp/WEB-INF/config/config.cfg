DS.DSRipartizioniLettureDettaglioStampa.Class=net.project.dataset.DBDataSet
DS.DSRipartizioniLettureDettaglioStampa.Row=net.projectsrl.db.PjDBRow
DS.DSRipartizioniLettureDettaglioStampa.Query= with w as \
( select * from V_MONEY_3_SENZA_DETTAGLI as ri #WHERECONDITION# ORDER BY DENOMINAZIONE) \
select * from w union all \
SELECT 0 as id_dettaglio, 0 as id_modulo, \
0                                                          AS id_condomino, \
       'TOTALE'                                                   AS DENOMINAZIONE, \
       sum(millesimi) as millesimi, \
       Sum(numero_ripartitori)::int                                    AS NUMERO_RIPARTITORI , \
       Sum(numero_ripartitori_per_totale)::int as NUMERO_RIPARTITORI_per_totale, \
       Sum(lettura_singolo_per_totale)                                               AS lettura, \
       Sum(lettura_acs)                                           AS lettura_acs, \
       Sum(lettura_afs)                                           AS lettura_afs, \
0 as lettura_singolo_per_totale \
FROM   w  




DS.DSRipartizioniLettureDettaglioStampaConDettagli.Class=net.project.dataset.DBDataSet
DS.DSRipartizioniLettureDettaglioStampaConDettagli.Row=net.projectsrl.db.PjDBRow
DS.DSRipartizioniLettureDettaglioStampaConDettagli.Query= \
with w as \
( select * from V_MONEY_3_CON_DETTAGLI as ri #WHERECONDITION#) \
select \
	0 AS ordine,\
	id_dettaglio,\
	id_modulo,\
	id_condomino,\
	DENOMINAZIONE,\
	millesimi,\
	NUMERO_RIPARTITORI ,\
	NUMERO_RIPARTITORI_per_totale,\
	lettura,\
	lettura_acs,\
	lettura_singolo,\
	lettura_acs_singolo,\
	lettura_singolo_per_totale,\
	rilevatore,\
	stanza \
from w union all \
SELECT 	\
99 AS ordine,\
0 as id_dettaglio, 0 as id_modulo, \
0 AS id_condomino, \
'TOTALE' AS DENOMINAZIONE, \
sum(millesimi) as millesimi, \
Sum(numero_ripartitori_per_totale)::int AS NUMERO_RIPARTITORI , \
0 as NUMERO_RIPARTITORI_per_totale, \
coalesce(Sum(lettura_singolo_per_totale),0) AS lettura, \
coalesce(Sum(lettura_acs_singolo_per_totale),0) AS lettura_acs, \
coalesce(Sum(lettura_afs_singolo_per_totale),0) AS lettura_afs, \
0 as lettura_singolo, \
0 as lettura_acs_singolo, \
0 as lettura_afs_singolo, \
0 as lettura_singolo_per_totale, \
0 as lettura_acs_singolo_per_totale, \
0 as lettura_afs_singolo_per_totale, \
'' as rilevatore, \
'' as stanza \
FROM   w \
ORDER BY ordine,denominazione


