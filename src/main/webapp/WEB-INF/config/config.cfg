DS.DSRipartizioniStorico.Query=select to_char(DATE (ru.ts_ins::timestamp::date), 'DD/MM/YYYY') as data_inserimento,to_char(ru.ts_ins, 'HH24:MM') as ora_inserimento, pa.descrizione as descr_stato,denominazione,indirizzo,localita,provincia,tipo,CASE WHEN TIPO = 'L' THEN 'SOLA LETTURA' ELSE 'COMPLETA' END AS TIPO_RIPARTIZIONE,substring(data_dal,9,2)||'/'||substring(data_dal,6,2)||'/'||substring(data_dal,1,4) ||' - '||substring(data_al,9,2)||'/'||substring(data_al,6,2)||'/'||substring(data_al,1,4) as periodo, ru.* from ripartizioni as ru left outer join condomini as co on ru.id_condominio=co.id_modulo left outer join parametri as pa on ru.stato=pa.codice and pa.dominio='STA' WHERE RU.STATO='APP' and RU.ID_AZIENDA #WHERECONDITION_AZIENDE# AND ID_CONDOMINIO #WHERECONDITION_PROFILI# ORDER BY ID_MODULO DESC

DS.DSRipartizioniUNIStorico.Class=net.project.dataset.DBDataSet
