inner join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
inner join vista_scarico_data_massima as sc on ud.rilevatore=sc.n_fabbrica_dispositivo \
where nome_file=(SELECT DISTINCT nome_file FROM vista_scarico_data_massima as scarico where id_condominio=(select condomini.id_modulo from condomini left outer join utenze as ut on ut.id_condominio=condomini.id_modulo #WHERECONDITION#) AND data_di_lettura= \
