DS.DSCrediti.Class=net.project.dataset.DBDataSet
DS.DSCrediti.Row=project.db.PjDBRow
DS.DSCrediti.Query=\
select distinct ragsoc, crediti as crediti_acquistati,data_scadenza_crediti, mail, \
DATE_PART('day',to_date(data_scadenza_crediti,'YYYY/MM/DD')::timestamp without time zone -now())::int as scadenza_giorni, \
(SELECT COUNT(RILEVATORE)::int FROM UTENZE_DETTAGLIO AS UD LEFT OUTER JOIN UTENZE AS UT ON UD.ID_MODULO=UT.ID_MODULO \
WHERE ID_AZIENDA in \
(select AZIENDE.id_azienda from aziende left outer join UTENTI_AZIENDE AS UA on AZIENDE.ID_AZIENDA=UA.ID_AZIENDA WHERE UA.ID_UTENTE=1))  AS CREDITI_UTILIZZATI, \
crediti-(SELECT COUNT(RILEVATORE)::int FROM UTENZE_DETTAGLIO AS UD LEFT OUTER JOIN UTENZE AS UT ON UD.ID_MODULO=UT.ID_MODULO \
WHERE ID_AZIENDA in \
(select AZIENDE.id_azienda from aziende left outer join UTENTI_AZIENDE AS UA on AZIENDE.ID_AZIENDA=UA.ID_AZIENDA WHERE UA.ID_UTENTE=1)) as crediti_utilizzabili \
from utenti as usr \
inner join UTENTI_AZIENDE AS UA on UA.ID_UTENTE=USR.ID_UTENTE \
inner join aziende as az on ua.id_azienda=az.id_azienda #WHERECONDITION#


