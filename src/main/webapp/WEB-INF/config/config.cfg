DS.DSRilevatoriRiepilogoImportDettaglio.Class=net.project.dataset.DBDataSet
DS.DSRilevatoriRiepilogoImportDettaglio.Row=project.db.PjDBRow
DS.DSRilevatoriRiepilogoImportDettaglio.Query=\
select \
count(*) as importati, \
(select count(rilevatore) \
+(select count(*) from network where id_condominio in (select distinct id_condominio from scarico #WHERECONDITION# and id_condominio>0)) \
+(select count(*) from contatori where id_condominio in (select distinct id_condominio from scarico #WHERECONDITION# and id_condominio>0)) \
from condomini \
left outer join utenze as ut on ut.id_condominio=condomini.id_modulo \
left outer join utenze_dettaglio as ud on ud.id_modulo=ut.id_modulo \
where id_condominio in (select distinct id_condominio from scarico #WHERECONDITION# and id_condominio>0)) as totale_rilevatori_condominio, \
count(CASE WHEN valore_valido and id_condominio>0  and fattore_energia<>'14' THEN 1 END)+count(CASE WHEN id_condominio>0 and fattore_energia='14' THEN 1 END) as valore_valido, \
count(CASE WHEN valore_non_valido and id_condominio>0  and fattore_energia<>'14' THEN 1 END) as valore_non_valido, \
count(CASE WHEN lettura_zero and id_condominio>0 THEN 1 END) as lettura_zero, \
count(CASE WHEN rilevatore_in_anomalia and id_condominio>0 THEN 1 END) as rilevatore_in_anomalia, \
count(CASE WHEN rilevatore_ok and id_condominio>0 THEN 1 END)+count(CASE WHEN id_condominio>0 and fattore_energia='14' THEN 1 END) as rilevatore_ok, \
count(CASE WHEN rilevatore_non_censito_da_scartare THEN 1 END) as rilevatore_non_censito_da_scartare, \
elenco_rilevatore_non_censito_da_scartare, \
conta_rilevatore_censito_non_scaricato, \
elenco_rilevatore_censito_non_scaricato \
from( \
select \
CASE WHEN isnumeric(stat_value1) then true else false end as valore_valido, \
CASE WHEN isnumeric(stat_value1) then false else true end as valore_non_valido, \
CASE WHEN (stat_value1='0') then true else false end as lettura_zero, \
case when (anomalia<>'' or length(data_anomalia)>6) then true else false end as rilevatore_in_anomalia, \
CASE WHEN id_condominio=0 then true else false end as rilevatore_non_censito_da_scartare, \
(select string_agg(n_fabbrica_dispositivo, ', ') from scarico #WHERECONDITION# and id_condominio=0) as elenco_rilevatore_non_censito_da_scartare, \
(select count(*)  from utenze_dettaglio as ud left outer join utenze as ut on ud.id_modulo=ut.id_modulo where id_condominio in \
(select distinct id_condominio from scarico #WHERECONDITION# and id_condominio>0) \
and rilevatore not in \
(select n_fabbrica_dispositivo  from scarico where id_condominio in (select distinct id_condominio from scarico #WHERECONDITION# and id_condominio>0)) \
) as conta_rilevatore_censito_non_scaricato, \
(select string_agg(rilevatore, ', ')  from utenze_dettaglio as ud left outer join utenze as ut on ud.id_modulo=ut.id_modulo where id_condominio in \
(select distinct id_condominio from scarico #WHERECONDITION# and id_condominio>0) \
and rilevatore not in \
(select n_fabbrica_dispositivo  from scarico where id_condominio in (select distinct id_condominio from scarico #WHERECONDITION# and id_condominio>0)) \
) as elenco_rilevatore_censito_non_scaricato, \
CASE WHEN (isnumeric(stat_value1) and (anomalia='' or length(data_anomalia)<6)) then true else false end as rilevatore_ok, \
* from scarico #WHERECONDITION# order by ID_MODULO \
) as tabella \
group by conta_rilevatore_censito_non_scaricato,elenco_rilevatore_censito_non_scaricato,elenco_rilevatore_non_censito_da_scartare






