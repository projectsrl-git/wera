Sum(volume_attuale) AS volume_attuale, \
Sum(lettura_contatore_attuale) AS lettura_contatore_attuale, \
unita_di_misura \
FROM ( \
SELECT DISTINCT id_modulo AS id_condominio,denominazione, indirizzo, localita, provincia, id_contatore, id_condomino, condomino, locatario, data_di_lettura, \
Count(rilevatore) filter (WHERE rilevatore IN ( SELECT rilevatore FROM   utenze_dettaglio)) AS num_rilevatori, \
count(rilevatore) filter (WHERE rilevatore IN ( SELECT contatore FROM   contatori)) AS num_contatori, \
tipologia, \
sum(lettura_attuale::float) filter (WHERE rilevatore IN ( SELECT rilevatore FROM   utenze dettaglio)) AS lettura_attuale, \
sum(volume_attuale::float)       AS volume_attuale, \
sum(lettura_attuale::float) filter (WHERE rilevatore IN ( SELECT contatore FROM   contatori)) AS lettura_contatore_attuale, \
unita_di_misura \
FROM ( \
SELECT co.id_modulo, co.denominazione, co.indirizzo, co.localita, co.provincia, 0 AS id_contatore, ut.id_modulo     AS id_condomino, ut.denominazione AS condomino, ut.locatario, \
CASE WHEN fattore_energia LIKE '08%' THEN 'Ripartitore HCA' WHEN fattore_energia LIKE '07%' THEN 'Contatore AFS' WHEN fattore_energia LIKE '06%' THEN 'Contatore ACS' ELSE 'Ripartitore HCA' END AS tipologia , \
data_di_lettura, rilevatore, lettura_attuale, volume_attuale, \
CASE WHEN fattore_energia LIKE '08%' THEN 'HCA' WHEN fattore_energia LIKE '07%' THEN 'M3' WHEN fattore_energia LIKE '06%' THEN 'M3' ELSE 'HCA' END AS unita_di_misura \
