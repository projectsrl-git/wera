DS.DSLettureConsumiCondominiStorico.Class=net.project.dataset.DBDataSet
DS.DSLettureConsumiCondominiStorico.Row=net.projectsrl.db.PjDBRow
DS.DSLettureConsumiCondominiStorico.Query=\
select distinct id_condominio,denominazione,indirizzo,localita,provincia,max(trim(replace(replace(data_di_lettura,'x',''),'--/--/--',''))) as data_di_lettura,sum(num_rilevatori) as num_rilevatori,sum(num_contatori) as num_contatori,tipologia,sum(lettura_attuale) as lettura_attuale,sum(volume_attuale) as volume_attuale,sum(lettura_contatore_attuale) as lettura_contatore_attuale,unita_di_misura \
from( \
select distinct id_condominio,denominazione,indirizzo,localita,provincia,id_condomino,condomino,locatario,max(trim(replace(replace(data_di_lettura,'x',''),'--/--/--',''))) as data_di_lettura,sum(num_rilevatori) as num_rilevatori,sum(num_contatori) as num_contatori,tipologia,sum(lettura_attuale) as lettura_attuale,sum(volume_attuale) as volume_attuale,sum(lettura_contatore_attuale) as lettura_contatore_attuale,unita_di_misura \
from( \
select distinct id_modulo as id_condominio, denominazione,indirizzo,localita,provincia,id_contatore,id_condomino,condomino,locatario,data_di_lettura,count(rilevatore) FILTER (WHERE rilevatore in (select rilevatore from utenze_dettaglio)) as num_rilevatori,count(rilevatore) FILTER (WHERE rilevatore in (select contatore from contatori)) as num_contatori, tipologia, \
sum(lettura_attuale) FILTER (WHERE rilevatore in (select rilevatore from utenze dettaglio)) as lettura_attuale, \
sum(volume_attuale) as volume_attuale, \
sum(lettura_attuale) FILTER (WHERE rilevatore in (select contatore from contatori)) as lettura_contatore_attuale, \
unita_di_misura \
from ( \
select co.id_modulo,co.denominazione,co.indirizzo,co.localita,co.provincia,0 as id_contatore,ut.id_modulo as id_condomino,ut.denominazione as condomino,ut.locatario,case when fattore_energia like '08%' then 'Ripartitore HCA' \
when fattore_energia like '07%' then 'Contatore AFS' \
when fattore_energia like '06%' then 'Contatore ACS' \
else 'Ripartitore HCA' end as tipologia,data_di_lettura,rilevatore,\
lettura_attuale,\
volume_attuale, \
unita_di_misura from condomini as co \
inner join utenze as ut on co.id_modulo=ut.id_condominio \
inner join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join vista_scarico_data_massima as scarico on ud.rilevatore=n_fabbrica_dispositivo \
#WHERECONDITION# AND CO.ID_AZIENDA #WHERECONDITION_AZIENDE# AND CO.ID_MODULO #WHERECONDITION_PROFILI# \
union \
select co.id_modulo,co.denominazione,co.indirizzo,co.localita,co.provincia,ct.id_modulo as id_contatore, 0 as id_condomino, '' as condomino,'' as locatario,'Contatore '||descrizione as tipologia,data_di_lettura,contatore as rilevatore, \
lettura_attuale,\
volume_attuale, \
unita_di_misura from condomini as co \
inner join contatori as ct on ct.id_condominio=co.id_modulo \
inner join vista_scarico_data_massima as scarico on ct.contatore=n_fabbrica_dispositivo \
left outer join parametri as pa on id_tipologia=pa.codice and dominio='TCO' \
#WHERECONDITION# AND CO.ID_AZIENDA #WHERECONDITION_AZIENDE# AND CO.ID_MODULO #WHERECONDITION_PROFILI# \
) as tab \
group by id_modulo,denominazione,indirizzo,localita,provincia,condomino,locatario,data_di_lettura,unita_di_misura,tipologia,id_contatore,id_condomino \
)as tab2 \
group by id_condominio,denominazione,indirizzo,localita,provincia,condomino,locatario,data_di_lettura,unita_di_misura,tipologia,id_contatore,id_condomino \
)as tab3 \
group by id_condominio,denominazione,unita_di_misura,tipologia,tipologia,unita_di_misura,indirizzo,localita,provincia \
order by denominazione,tipologia desc



DS.DSLettureConsumiCondominiDettaglioStoricoStampa.Class=net.project.dataset.DBDataSet
DS.DSLettureConsumiCondominiDettaglioStoricoStampa.Row=net.projectsrl.db.PjDBRow
DS.DSLettureConsumiCondominiDettaglioStoricoStampa.Query=\
select alias_azienda, 1+count(*) over ()::int as numero,* from ( \
with w as (\
select distinct id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,id_condomino,condomino,locatario,data_di_lettura,sum(num_rilevatori) as num_rilevatori,sum(num_contatori) as num_contatori,tipologia,sum(lettura_attuale) as lettura_attuale,sum(volume_attuale) as volume_attuale,sum(lettura_contatore_attuale) as lettura_contatore_attuale,unita_di_misura \
from( \
select distinct id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,id_contatore,id_condomino,condomino,locatario,data_di_lettura,count(rilevatore) FILTER (WHERE rilevatore in (select rilevatore from utenze_dettaglio)) as num_rilevatori,count(rilevatore) FILTER (WHERE rilevatore in (select contatore from contatori)) as num_contatori, tipologia, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select rilevatore from utenze dettaglio)) as lettura_attuale, \
sum(volume_attuale::float) as volume_attuale, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select contatore from contatori)) as lettura_contatore_attuale, \
unita_di_misura \
from ( \
select co.id_modulo as id_condominio, ut.id_modulo as id_rilevatore,co.denominazione,co.indirizzo,co.localita,co.provincia,0 as id_contatore,ut.id_modulo as id_condomino,ut.denominazione as condomino,ut.locatario,case when fattore_energia like '08%' then 'Ripartitore HCA' \
when fattore_energia like '07%' then 'Contatore AFS' \
when fattore_energia like '06%' then 'Contatore ACS' \
else 'Ripartitore HCA' end as tipologia,data_di_lettura,rilevatore,lettura_attuale,volume_attuale,unita_di_misura from condomini as co \
inner join utenze as ut on co.id_modulo=ut.id_condominio \
inner join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join vista_scarico_data_massima AS SCARICO on ud.rilevatore=n_fabbrica_dispositivo \
#WHERECONDITION# \
and ut.id_modulo #WHERECONDITION_PROFILI_LETTURE# \
and nome_file=(select distinct nome_file from vista_scarico_data_massima AS SCARICO #WHERECONDITION# ) \
union \
select co.id_modulo as id_condominio, ct.id_modulo as id_rilevatore,co.denominazione,co.indirizzo,co.localita,co.provincia,ct.id_modulo as id_contatore, 0 as id_condomino, '' as condomino,'' as locatario,'Contatore '||descrizione as tipologia, data_di_lettura,contatore as rilevatore,lettura_attuale,volume_attuale,unita_di_misura from condomini as co \
inner join contatori as ct on ct.id_condominio=co.id_modulo \
inner join vista_scarico_data_massima AS SCARICO on ct.contatore=n_fabbrica_dispositivo \
left outer join parametri as pa on id_tipologia=pa.codice and dominio='TCO' \
#WHERECONDITION# \
and co.id_modulo #WHERECONDITION_PROFILI_LETTURE# \
and nome_file=(select distinct nome_file from vista_scarico_data_massima AS SCARICO #WHERECONDITION# ) \
) as tab \
group by id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,condomino,locatario,data_di_lettura,unita_di_misura,tipologia,id_contatore,id_condomino \
)as tab2 \
group by id_condominio,id_rilevatore,denominazione,indirizzo,localita,provincia,condomino,locatario,unita_di_misura,tipologia,tipologia,unita_di_misura,id_contatore,id_condomino,data_di_lettura \
order by tipologia desc,condomino,locatario \
) select * from w union all \
select \
0 as id_condominio, \
0 as id_rilevatore, \
'TOTALE' AS DENOMINAZIONE, \
'' AS indirizzo, \
'' AS localita, \
'' AS provincia, \
0 as id_condomino, \
'TOTALE' AS condomino, \
'TOTALE' as locatario, \
'' as data_di_lettura, \
SUM (num_rilevatori) AS num_rilevatori, \
SUM (num_contatori) AS num_contatori, \
max (tipologia) AS tipologia, \
SUM (lettura_attuale) AS lettura_attuale, \
SUM (volume_attuale) AS volume_attuale, \
SUM (lettura_contatore_attuale) AS lettura_contatore_attuale, \
max (unita_di_misura) AS unita_di_misura \
from w \
) as t1 \
left outer join condomini as con on id_condominio=con.id_modulo \
left outer join aziende as az on az.id_azienda=con.id_azienda ORDER BY tipologia desc,condomino, locatario


