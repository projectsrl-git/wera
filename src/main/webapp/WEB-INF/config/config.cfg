DS.DSLettureConsumiCondomini.Class=net.project.dataset.DBDataSet
DS.DSLettureConsumiCondomini.Row=net.projectsrl.db.PjDBRow
#DS.DSLettureConsumiCondomini.Query=\
select distinct id_condominio,denominazione,indirizzo,localita,provincia,max(trim(replace(replace(DATA_DI_SCARICO,'x',''),'--/--/--',''))) as DATA_DI_LETTURA,sum(num_rilevatori) as num_rilevatori,sum(num_contatori) as num_contatori,tipologia,sum(lettura_attuale) as lettura_attuale,sum(volume_attuale) as volume_attuale,sum(lettura_contatore_attuale) as lettura_contatore_attuale,unita_di_misura \
from( \
select distinct id_condominio,denominazione,indirizzo,localita,provincia,id_condomino,condomino,locatario,max(trim(replace(replace(DATA_DI_SCARICO,'x',''),'--/--/--',''))) as DATA_DI_SCARICO,sum(num_rilevatori) as num_rilevatori,sum(num_contatori) as num_contatori,tipologia,sum(lettura_attuale) as lettura_attuale,sum(volume_attuale) as volume_attuale,sum(lettura_contatore_attuale) as lettura_contatore_attuale,unita_di_misura \
from( \
select distinct id_modulo as id_condominio, denominazione,indirizzo,localita,provincia,id_contatore,id_condomino,condomino,locatario,DATA_DI_SCARICO,count(rilevatore) FILTER (WHERE rilevatore in (select rilevatore from utenze_dettaglio)) as num_rilevatori,count(rilevatore) FILTER (WHERE rilevatore in (select contatore from contatori)) as num_contatori, tipologia, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select rilevatore from utenze dettaglio)) as lettura_attuale, \
sum(volume_attuale::float) as volume_attuale, \
sum(lettura_attuale::float) FILTER (WHERE rilevatore in (select contatore from contatori)) as lettura_contatore_attuale, \
unita_di_misura \
from ( \
select co.id_modulo,co.denominazione,co.indirizzo,co.localita,co.provincia,0 as id_contatore,ut.id_modulo as id_condomino,ut.denominazione as condomino,ut.locatario, \
case when fattore_energia like '08%' then 'Ripartitore HCA' \
when fattore_energia like '07%' then 'Contatore AFS' \
when fattore_energia like '06%' then 'Contatore ACS' \
else 'Ripartitore HCA' end as tipologia \
,substring(DATA_DI_SCARICO,1,10) as DATA_DI_SCARICO,rilevatore,0||replace(lettura_attuale,'x x x','0') as lettura_attuale,0||replace(volume_attuale,'x x x','0') as volume_attuale, \
case when fattore_energia like '08%' then 'HCA' \
when fattore_energia like '07%' then 'M3' \
when fattore_energia like '06%' then 'M3' \
else 'HCA' end as unita_di_misura \
from condomini as co \
inner join utenze as ut on co.id_modulo=ut.id_condominio \
inner join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join scarico on ud.rilevatore=n_fabbrica_dispositivo \
