DS.DSRipartizioniDifferenzaPercentualeSolaLettura.Class=net.project.dataset.DBDataSet
DS.DSRipartizioniDifferenzaPercentualeSolaLettura.Row=project.db.PjDBRow
DS.DSRipartizioniDifferenzaPercentualeSolaLettura.Query=\
select *, \
'La differenza tra questa ripartizione/lettura e la precedente ripartizione/lettura dello stesso periodo temporale e'' di ' \
||differenza_lettura||' HCA ('||differenza_lettura_percentuale||'%) e di '||differenza_lettura_acs||' m3 ACS ('||differenza_lettura_acs_percentuale||'%)' AS TESTO_DIFFERENZA \
from( \
select (differenza_lettura*100  / case when lettura=0 or lettura is null then 1 else lettura end)::int as differenza_lettura_percentuale, \
(differenza_lettura_acs*100  / case when lettura_acs=0 or lettura_acs is null then 1 else lettura_acs end)::int as differenza_lettura_acs_percentuale, \
* from ( select coalesce(lettura - lag(lettura) over (order by data_dal),0) as differenza_lettura, coalesce(lettura_acs - lag(lettura_acs) over (order by data_dal),0) as differenza_lettura_acs, * \
from ripartizioni_letture #WHERECONDITION# order by data_dal ) as tab order by data_dal desc,id_modulo desc limit 1) as tab




DS.DSRipartizioniDifferenzaPercentualeUNI.Class=net.project.dataset.DBDataSet
DS.DSRipartizioniDifferenzaPercentualeUNI.Row=project.db.PjDBRow
DS.DSRipartizioniDifferenzaPercentualeUNI.Query=\
select *, \
'La differenza tra questa ripartizione/lettura e la precedente ripartizione/lettura dello stesso periodo temporale e'' di ' \
||differenza_lettura||' HCA ('||differenza_lettura_percentuale||'%) e di '||differenza_lettura_acs||' m3 ACS ('||differenza_lettura_acs_percentuale||'%)' AS TESTO_DIFFERENZA \
from( \
select (differenza_lettura*100  / case when lettura=0 or lettura is null then 1 else lettura end)::int as differenza_lettura_percentuale, \
(differenza_lettura_acs*100  / case when lettura_acs=0 or lettura_acs is null then 1 else lettura_acs end)::int as differenza_lettura_acs_percentuale, \
* from ( select distinct data_dal,ru.lettura,ru.lettura_acs,coalesce(ru.lettura - lag(ru.lettura) over (order by data_dal),0) as differenza_lettura, coalesce(ru.lettura_acs - lag(ru.lettura_acs) over (order by data_dal),0) as differenza_lettura_acs \
from ripartizioni_uni_dettaglio as rud left outer join ripartizioni_uni as ru on rud.id_modulo=ru.id_modulo #WHERECONDITION# order by data_dal ) as tab order by data_dal desc limit 1) as tab




DS.DSRipartizioniDifferenzaPercentuale.Class=net.project.dataset.DBDataSet
DS.DSRipartizioniDifferenzaPercentuale.Row=project.db.PjDBRow
DS.DSRipartizioniDifferenzaPercentuale.Query=\
select *, \
'La differenza tra questa ripartizione/lettura e la precedente ripartizione/lettura dello stesso periodo temporale e'' di ' \
||differenza_lettura||' HCA ('||differenza_lettura_percentuale||'%) e di '||differenza_lettura_acs||' m3 ACS ('||differenza_lettura_acs_percentuale||'%)' AS TESTO_DIFFERENZA \
from( \
select (differenza_lettura*100  / case when lettura=0 or lettura is null then 1 else lettura end)::int as differenza_lettura_percentuale, \
(differenza_lettura_acs*100  / case when lettura_acs=0 or lettura_acs is null then 1 else lettura_acs end)::int as differenza_lettura_acs_percentuale, \
* from ( \
select distinct RU.data_dal,sum(rud.lettura) as lettura,0 as lettura_acs,coalesce(sum(rud.lettura) - lag(sum(rud.lettura)) over (order by data_dal),0) as differenza_lettura \
, 0 as differenza_lettura_acs \
from ripartizioni_dettaglio as rud left outer join ripartizioni as ru on rud.id_modulo=ru.id_modulo #WHERECONDITION# group by ru.data_dal order by data_dal ) \
as tab order by data_dal desc limit 1) as tab



