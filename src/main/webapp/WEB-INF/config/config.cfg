DS.DSDatiRipartizioniLettureSingolo.Class=net.project.dataset.DBDataSet
DS.DSDatiRipartizioniLettureSingolo.Row=net.projectsrl.db.PjDBRow
DS.DSDatiRipartizioniLettureSingolo.Query=\
SELECT id_condomino, denominazione,denominazione as locatario,millesimi as millesimi_Condomino, stanza,rilevatore, \
Coalesce(SUM(Cast(lettura AS INT)), 0)::int     AS lettura_condomino, \
Coalesce(SUM(lettura_acs::numeric(10,2)), 0)::numeric(10,2) AS lettura_acs_condomino, \
millesimi_clima, millesimi_acs, numero_ripartitori::int as rilevatori_condomino FROM \
(SELECT da.id_condominio, da.rilevatore, lettura, lettura_acs, denominazione, ut.id_modulo          AS id_condomino, \
millesimi_clima, millesimi_acs, fabbisogno_clima, fabbisogno_acs, millesimi, tipo_utenza, stanza, \
(SELECT Count(rilevatore) FROM   utenze_dettaglio AS ud WHERE  ut.id_modulo = ud.id_modulo GROUP  BY id_modulo) AS numero_ripartitori \
FROM   dati_rilevatori AS da left outer join utenze_dettaglio AS ud ON da.rilevatore = ud.rilevatore \
left outer join utenze AS ut ON ut.id_modulo = ud.id_modulo \
WHERE  To_date('01/' || Lpad(da.mese :: text, 2, '0') || '/' || da.anno, 'DD/MM/YYYY') <= To_date('#DATA_AL#', 'DD/MM/YYYY') AND \
To_date('01/' || Lpad(da.mese :: text, 2, '0') || '/' || da.anno, 'DD/MM/YYYY') >= To_date('#DATA_DAL#', 'DD/MM/YYYY') \
AND da.id_condominio =#ID_CONDOMINIO# AND ut.id_modulo =#ID_CONDOMINO#) AS tbl \
GROUP  BY id_condomino, denominazione, millesimi_clima, millesimi_acs, numero_ripartitori, fabbisogno_clima, fabbisogno_acs, millesimi, tipo_utenza ,rilevatore,stanza \
ORDER  BY tipo_utenza DESC, denominazione ASC



