DS.DSCondomini.Query=SELECT CASE WHEN TIPO = 'L' THEN 'SOLA LETTURA' ELSE 'COMPLETA' END AS TIPO_RIPARTIZIONE, COALESCE(NOME,'')||' '||COALESCE(COGNOME,'') AS AMMINISTRATORE, ID_MODULO,DENOMINAZIONE,condomini.INDIRIZZO,condomini.LOCALITA,condomini.PROVINCIA,SIM,SCARICO FROM CONDOMINI LEFT OUTER JOIN UTENTI ON ID_UTENTE=ID_AMMINISTRATORE  WHERE CONDOMINI.ID_AZIENDA #WHERECONDITION_AZIENDE# AND CONDOMINI.ID_MODULO #WHERECONDITION_PROFILI# ORDER BY DENOMINAZIONE


