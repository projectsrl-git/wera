DS.DSDirezioni.Class=net.project.dataset.DBDataSet
DS.DSDirezioni.Row=project.db.PjDBRow
DS.DSDirezioni.Query=\
SELECT \
	DI.* \
	,AZ.RAGSOC AS RAGSOC_AZIENDA \
	,DS.NOME_DIREZIONE AS NOME_DIREZIONE_PARENT \
FROM DIREZIONI AS DI \
LEFT OUTER JOIN DIREZIONI AS DS \
ON DI.ID_DIREZIONE_PARENT = DS.ID_DIREZIONE \
INNER JOIN AZIENDE AS AZ \
ON DI.ID_AZIENDA = AZ.ID_AZIENDA \
#WHERECONDITION# \
ORDER BY AZ.RAGSOC \
	,DI.NOME_DIREZIONE


DS.DSStaffDirezioniCombo.Class=net.project.dataset.DBDataSet
DS.DSStaffDirezioniCombo.Row=project.db.PjDBRow
DS.DSStaffDirezioniCombo.Query=\
SELECT \
	SD.ID_STAFF_DIREZIONE \
	,DI.ID_AZIENDA \
	,AZ.RAGSOC \
	,SD.ID_DIREZIONE \
	,DI.NOME_DIREZIONE \
	,DI.NOME_DIREZIONE_BREVE \
	,DI.ID_DIREZIONE_PARENT \
	,SD.ID_RISORSA_AZIENDA \
	,RA.ID_RISORSA \
	,RI.NOME + ' ' + RI.COGNOME AS NOMINATIVO \
FROM STAFF_DIREZIONI AS SD \
INNER JOIN DIREZIONI AS DI \
ON DI.ID_DIREZIONE = SD.ID_DIREZIONE \
LEFT OUTER JOIN DIREZIONI AS DP \
ON DI.ID_DIREZIONE_PARENT = DP.ID_DIREZIONE \
INNER JOIN AZIENDE AS AZ \
ON DI.ID_AZIENDA = AZ.ID_AZIENDA \
LEFT OUTER JOIN RISORSE_AZIENDA AS RA \
ON SD.ID_RISORSA_AZIENDA = RA.ID_RISORSA_AZIENDA \
INNER JOIN RISORSE AS RI \
ON RA.ID_RISORSA = RI.ID_RISORSA \
#WHERECONDITION# \
ORDER BY ID_STAFF_DIREZIONE

DS.DSStaffDirezioni.Class=net.project.dataset.DBDataSet
DS.DSStaffDirezioni.Row=project.db.PjDBRow
