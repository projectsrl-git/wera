FORZA_MOTRICE, \
CONDUZIONE, \
CONDUZIONE_ANTICIPO, \
CONDUZIONE_SALDO, \
MANUTENZIONE_ORDINARIA, \
MANUTENZIONE_STRAORDINARIA, \
COSTI_LETTURE, \
TOTALE_SENZA_LETTURE, \
TOTALE_CON_LETTURE, \
METANO, \
SUBTOTALE_COSTI_MILLESIMI \
from ripartizioni_dettaglio as ri \
#WHERECONDITION# \
ORDER BY DENOMINAZIONE) \
select * from w union all \
select \
0 as id_dettaglio, \
0 as id_modulo, \
0 as id_condomino, \
'TOTALE' AS DENOMINAZIONE, \
SUM (MILLESIMI) AS MILLESIMI, \
SUM (NUMERO_RIPARTITORI) AS NUMERO_RIPARTITORI, \
SUM (LETTURA) AS LETTURA, \
SUM (METANO_FISSO) AS METANO_FISSO, \
SUM (METANO_MILLESIMI) AS METANO_MILLESIMI, \
SUM (FORZA_MOTRICE) AS FORZA_MOTRICE, \
SUM (CONDUZIONE) AS CONDUZIONE, \
SUM (CONDUZIONE_ANTICIPO) AS CONDUZIONE_ANTICIPO, \
SUM (CONDUZIONE_SALDO) AS CONDUZIONE_SALDO, \
SUM (MANUTENZIONE_ORDINARIA) AS MANUTENZIONE_ORDINARIA, \
SUM (MANUTENZIONE_STRAORDINARIA) AS MANUTENZIONE_STRAORDINARIA, \
SUM (COSTI_LETTURE) AS COSTI_LETTURE, \
SUM (TOTALE_SENZA_LETTURE) AS TOTALE_SENZA_LETTURE, \
SUM (TOTALE_CON_LETTURE) AS TOTALE_CON_LETTURE, \
SUM (METANO) AS METANO, \
SUM (SUBTOTALE_COSTI_MILLESIMI) AS SUBTOTALE_COSTI_MILLESIMI \
from w) as tab



