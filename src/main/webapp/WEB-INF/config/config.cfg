DS.DSRipartizioniLetture.Class=net.project.dataset.DBDataSet
DS.DSRipartizioniLetture.Row=net.projectsrl.db.PjDBRow
DS.DSRipartizioniLetture.Query=select to_char(DATE (ru.ts_ins::timestamp::date), 'DD/MM/YYYY') as data_inserimento,to_char(ru.ts_ins, 'HH24:MM') as ora_inserimento, pa.descrizione as descr_stato,coalesce(denominazione,'condominio non censito') as denominazione,indirizzo,localita,provincia,tipo,CASE WHEN TIPO = 'L' THEN 'SOLA LETTURA' ELSE 'COMPLETA' END AS TIPO_RIPARTIZIONE,CASE WHEN ru.TIPO_CONTABILIZZAZIONE = '1' THEN 'Contatori di calore/Contatori volumetrici' WHEN ru.TIPO_CONTABILIZZAZIONE = '2' THEN 'Ripartitori/Contatori volumetrici' END AS DESCR_TIPO_CONTABILIZZAZIONE,substring(data_dal,9,2)||'/'||substring(data_dal,6,2)||'/'||substring(data_dal,1,4) ||' - '||substring(data_al,9,2)||'/'||substring(data_al,6,2)||'/'||substring(data_al,1,4) as periodo, ru.* from ripartizioni_letture as ru left outer join condomini as co on ru.id_condominio=co.id_modulo left outer join parametri as pa on ru.stato=pa.codice and pa.dominio='STA'  #WHERECONDITION# AND RU.ID_AZIENDA #WHERECONDITION_AZIENDE# AND ID_CONDOMINIO #WHERECONDITION_PROFILI# order by id_modulo desc



