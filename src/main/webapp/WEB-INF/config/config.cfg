DS.DataSetStat35.Query=SELECT COUNT(distinct N_FABBRICA_DISPOSITIVO) as VALORE FROM \
(SELECT vssr.id_modulo,vssr.id_azienda,nome_file,vssr.id_condominio,id_dettaglio,stanza,n_fabbrica_dispositivo,ut.denominazione as condomino, locatario, ut.n_telefono, co.denominazione as condominio,co.indirizzo,co.localita,co.provincia,co.cap,sim, utenti.nome||' '||utenti.cognome as amministratore,telefono ,anomalia,pa.descrizione as descri_anomalia,pa3.descrizione as colore_html FROM V_SCARICO_SOLO_RILEVATORI as vssr \
left outer join utenze_dettaglio as ud on ud.rilevatore= vssr.n_fabbrica_dispositivo \
left outer join utenze as ut on ud.id_modulo=ut.id_modulo \
left outer join condomini as co on co.id_modulo=ut.id_condominio \
left outer join utenti on utenti.id_utente=id_amministratore \
left outer join utenti_profili as up on up.id_utente=utenti.id_utente \
left outer join parametri as pa on pa.codice=anomalia and pa.dominio='ERR' \
left outer join configurazione_errori as ce on ce.id_errore=pa.id_parametro \
left outer join parametri as pa2 on pa2.codice=ce.COLORE and pa2.dominio='COL' \
left outer join parametri as pa3 on pa3.codice=pa2.codice and pa3.dominio='CCO' \
WHERE N_FABBRICA_DISPOSITIVO NOT IN (SELECT distinct RILEVATORE FROM DATI_RILEVATORI) and n_fabbrica_dispositivo not in (select antenna from network) AND vssr.ID_AZIENDA #WHERECONDITION_AZIENDE# #WHERECONDITION# AND VSSR.ID_CONDOMINIO #WHERECONDITION_PROFILI#) as tab



