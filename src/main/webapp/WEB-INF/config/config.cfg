DS.DSDatiRipartizioni.Class=net.project.dataset.DBDataSet
DS.DSDatiRipartizioni.Row=net.projectsrl.db.PjDBRow
DS.DSDatiRipartizioni.Query=\
select id_condomino,denominazione,locatario,millesimi_condomino,sum(lettura_condomino)::int as lettura_condomino,sum(lettura_condomino_acs) as lettura_condomino_acs,Count(DISTINCT rilevatori_condomino)::int as rilevatori_condomino from ( \
select \
ut.id_modulo as id_condomino, ut.denominazione,ut.locatario,ut.millesimi as millesimi_condomino, \
coalesce(dr.lettura,0) AS lettura_condomino, \
coalesce(dr.lettura_acs,0) AS lettura_condomino_acs, \
ud.rilevatore AS rilevatori_condomino \
from ripartizioni as ri \
left outer join utenze as ut on ri.id_condominio=ut.id_condominio \
left outer join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join dati_rilevatori as dr on ud.rilevatore=dr.rilevatore \
where dr.id_condominio=#ID_CONDOMINIO# and  to_date('01/'|| LPAD(DR.MESE::text, 2, '0') || '/' || DR.ANNO ,'DD/MM/YYYY') \
<= to_date('#DATA_AL#','DD/MM/YYYY') AND to_date('01/' || LPAD(dr.MESE::text, 2, '0') || '/'  || dr.ANNO,'DD/MM/YYYY') \
>= to_date('#DATA_DAL#','DD/MM/YYYY') \
group by ut.id_modulo,lettura,lettura_acs,ud.rilevatore,mese,anno \
order by denominazione,locatario) as tab \
group by id_condomino,denominazione,locatario,millesimi_condomino ORDER  BY denominazione,locatario



DS.DSDatiRipartizioniSingolo.Class=net.project.dataset.DBDataSet
DS.DSDatiRipartizioniSingolo.Row=net.projectsrl.db.PjDBRow
DS.DSDatiRipartizioniSingolo.Query=\
SELECT DISTINCT ID_CONDOMINO,DENOMINAZIONE,LOCATARIO,MILLESIMI_CONDOMINO,STANZA,RILEVATORE,SUM(LETTURA_CONDOMINO)::INT as lettura_Condomino, SUM(lettura_condomino_acs)::INT AS lettura_Condomino_acs, RILEVATORI_CONDOMINO FROM ( \
select distinct \
ut.id_modulo as id_condomino, ut.denominazione,ut.locatario,ut.millesimi as millesimi_condomino,stanza,ud.rilevatore \
,coalesce(dr.lettura,0)::int as lettura_condomino \
,Coalesce(dr.lettura_ACS, 0)::INT AS lettura_condomino_acs \
, count(distinct ud.rilevatore)::int as rilevatori_condomino \
from ripartizioni as ri \
left outer join utenze as ut on ri.id_condominio=ut.id_condominio \
left outer join utenze_dettaglio as ud on ut.id_modulo=ud.id_modulo \
left outer join dati_rilevatori as dr on ud.rilevatore=dr.rilevatore \
where dr.id_condominio=#ID_CONDOMINIO# and  to_date('01/'|| LPAD(DR.MESE::text, 2, '0') || '/' || DR.ANNO ,'DD/MM/YYYY') \
<= to_date('#DATA_AL#','DD/MM/YYYY') AND to_date('01/' || LPAD(dr.MESE::text, 2, '0') || '/'  || dr.ANNO,'DD/MM/YYYY') \
>= to_date('#DATA_DAL#','DD/MM/YYYY') \
group by ut.id_modulo,ud.stanza,ud.rilevatore,dr.lettura,dr.lettura_acs \
order by denominazione,locatario \
) AS TAB GROUP BY ID_CONDOMINO,DENOMINAZIONE,LOCATARIO,MILLESIMI_CONDOMINO,STANZA,RILEVATORE,RILEVATORI_CONDOMINO \
ORDER BY DENOMINAZIONE,LOCATARIO


