DS.DSFileManager.Class=net.project.dataset.DBDataSet
DS.DSFileManager.Row=project.db.PjDBRow
DS.DSFileManager.Query=\
SELECT \
case \
when lower(nome_file) LIKE '%.doc' then 'fa-file' \
when lower(nome_file) LIKE '%.docx' then 'fa-file' \
when lower(nome_file) LIKE '%.txt' then 'fa-file' \
when lower(nome_file) LIKE '%.mp4' then 'fa-film' \
when lower(nome_file) LIKE '%.avi' then 'fa-film' \
when lower(nome_file) LIKE '%.jpg' then 'fa-picture-o' \
when lower(nome_file) LIKE '%.jpeg' then 'fa-picture-o' \
when lower(nome_file) LIKE '%.png' then 'fa-picture-o' \
when lower(nome_file) LIKE '%.xls' then 'fa-bar-chart-o' \
when lower(nome_file) LIKE '%.xlsx' then 'fa-bar-chart-o' \
when lower(nome_file) LIKE '%.mp3' then 'fa-music' \
else 'fa-file' \
end as icona, \
DENOMINAZIONE,PA.DESCRIZIONE AS DESCR_CATEGORIA, efifm.* \
FROM ELENCO_FILE_IMPORTATI_FILE_MANAGER as efifm \
LEFT OUTER JOIN CONDOMINI ON CONDOMINI.ID_MODULO=efifm.ID_CONDOMINIO \
LEFT OUTER JOIN PARAMETRI AS PA ON PA.CODICE = EFIFM.ID_CATEGORIA AND PA.DOMINIO='DOC' WHERE EFIFM.ID_AZIENDA #WHERECONDITION_AZIENDE# #WHERECONDITION# AND efifm.ID_CONDOMINIO #WHERECONDITION_PROFILI#


