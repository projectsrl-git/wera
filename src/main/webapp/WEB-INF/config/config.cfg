DS.DSDatiRilevatoriCensiti.Class=net.project.dataset.DBDataSet
DS.DSDatiRilevatoriCensiti.Row=net.projectsrl.db.PjDBRow
DS.DSDatiRilevatoriCensiti.Query=\
select co.id_azienda,id_condominio,'Ripartitore HCA' as tipologia,id_dettaglio,stanza,rilevatore,ut.denominazione as condomino, locatario, ut.n_telefono, co.denominazione as condominio,co.indirizzo,co.localita,co.provincia,co.cap,sim, utenti.nome||' '||utenti.cognome as amministratore,telefono \
from utenze_dettaglio as ud left outer join utenze as ut on ud.id_modulo=ut.id_modulo left outer join condomini as co on co.id_modulo=ut.id_condominio \
left outer join utenti on utenti.id_utente=id_amministratore \
left outer join utenti_profili as up on up.id_utente=utenti.id_utente \
where ut.ID_AZIENDA #WHERECONDITION_AZIENDE# \
union \
select \
co.id_azienda,id_condominio,\
case gateway when true then 'Gateway' else 'Antenna' end as tipologia,nw.id_modulo,'' as stanza,antenna as rilevatore,'' as condomino, '' as locatario, '' as n_telefono, co.denominazione as condominio,co.indirizzo,co.localita,co.provincia,co.cap,sim, utenti.nome||' '||utenti.cognome as amministratore,telefono \
from network as nw left outer join condomini as co on nw.id_condominio=co.id_modulo \
left outer join utenti on utenti.id_utente=id_amministratore \
left outer join utenti_profili as up on up.id_utente=utenti.id_utente \
where nw.ID_AZIENDA #WHERECONDITION_AZIENDE# \
union \
select \
co.id_azienda,id_condominio, \
descrizione as tipologia,nw.id_modulo,'' as stanza,contatore as rilevatore,'' as condomino, '' as locatario, '' as n_telefono, co.denominazione as condominio,co.indirizzo,co.localita,co.provincia,co.cap,sim, utenti.nome||' '||utenti.cognome as amministratore,telefono \
from contatori as nw left outer join condomini as co on nw.id_condominio=co.id_modulo \
left outer join utenti on utenti.id_utente=id_amministratore \
left outer join utenti_profili as up on up.id_utente=utenti.id_utente \
left outer join parametri as pa on pa.codice=nw.id_tipologia and pa.dominio='TCO' \
where nw.ID_AZIENDA #WHERECONDITION_AZIENDE# \
order by rilevatore



